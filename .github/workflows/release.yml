name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        if: ${{ secrets.APPLE_CERTIFICATE_1 != '' }}
        env:
          CERTIFICATE_PART1: ${{ secrets.APPLE_CERTIFICATE_1 }}
          CERTIFICATE_PART2: ${{ secrets.APPLE_CERTIFICATE_2 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "${CERTIFICATE_PART1}${CERTIFICATE_PART2}" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Archive
        run: |
          cd claude-usage-systray
          xcodebuild \
            -scheme ClaudeUsageSystray \
            -configuration Release \
            -archivePath build/ClaudeUsageSystray.xcarchive \
            archive

      - name: Export (Developer ID signed)
        if: ${{ secrets.APPLE_CERTIFICATE_1 != '' }}
        run: |
          cd claude-usage-systray
          xcodebuild -exportArchive \
            -archivePath build/ClaudeUsageSystray.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Package (ad-hoc signed, no certificate secrets)
        if: ${{ secrets.APPLE_CERTIFICATE_1 == '' }}
        run: |
          cd claude-usage-systray
          mkdir -p build/export
          cp -R build/ClaudeUsageSystray.xcarchive/Products/Applications/ClaudeUsageSystray.app build/export/
          ditto -c -k --keepParent build/export/ClaudeUsageSystray.app ClaudeUsageSystray.zip

      - name: Notarize
        if: ${{ secrets.APPLE_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          cd claude-usage-systray
          ditto -c -k --keepParent build/export/ClaudeUsageSystray.app ClaudeUsageSystray.zip
          xcrun notarytool submit ClaudeUsageSystray.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

      - name: Staple
        if: ${{ secrets.APPLE_ID != '' }}
        run: |
          cd claude-usage-systray
          xcrun stapler staple build/export/ClaudeUsageSystray.app
          ditto -c -k --keepParent build/export/ClaudeUsageSystray.app ClaudeUsageSystray.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: claude-usage-systray/ClaudeUsageSystray.zip
          generate_release_notes: true
